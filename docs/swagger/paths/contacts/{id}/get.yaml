tags:
  - Contacts
summary: Get contacts by id
operationId: getContact
description: 'Get contacts by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '67a9f57c950dcf1f1727a561'
responses:
  '200':
    description: 'Get contacts by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 67a9f57c950dcf1f1727a561!
            data:
              type: object
              $ref: ../../../components/schemas/contacts.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
