tags:
  - User
summary: Reset password
operationId: resetUser
description: Reset password
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: 'token'
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NzljYWExYzY2MGNjNzgyYWMwMjdlMDMiLCJlbWFpbCI6Inl1ZGdpbkBpLnVhIiwiaWF0IjoxNzM5MzczNjMyLCJleHAiOjE3MzkzNzQ1MzJ9.kMnLlJMrF0q5RorJ2e_2iF0YXb6W78o_umr8h412IH8'
            type: string
          password:
            description: 'new password'
            type: string
            example: '12365478'
responses:
  '200':
    description: Password changed.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - daata
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: UnauthorizedError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Token is expired or invalid.'
