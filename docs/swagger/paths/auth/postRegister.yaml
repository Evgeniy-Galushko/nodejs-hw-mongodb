tags:
  - User
summary: Registration via google mail
operationId: createUser
description: Registration via google mail
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: 'user email'
            example: 'johnWick@gmail.com'
            type: string
responses:
  '200':
    description: Creates a new user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - daata
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get Google OAuth url!
            data:
              type: object
              required:
                - url
              properties:
                url:
                  description: 'registration link'
                  type: string
                  example: 'https://accounts.google.com/o/oauth2/v2/auth?scope=htt2F%2Fwww.googleapis.com%2Fauth%2Fuserinfo.email%20https%%2Fwww.googleapis.com%2Fauth%2Fuserinfo.profile&response_type=code&client_id=1029686607625-v9p2buee22qr9r1skd5sa9saah55237h.apps.googleusntent.com&redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Fconfirm-google-auth'
